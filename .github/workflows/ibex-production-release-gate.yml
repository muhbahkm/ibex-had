name: IBEX Production Release Gate

on:
  push:
    branches:
      - spike/android-foundation-v1
    paths:
      - 'spike/ibex_foundation/**'
      - '.github/workflows/ibex-production-release-gate.yml'
  workflow_dispatch:

concurrency:
  group: ibex-production-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reject committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |)PRIVATE KEY|storePassword\s*=|keyPassword\s*=' -- ':!*.md'; then
            echo 'Potential secret material is committed to the repository.' >&2
            exit 1
          fi

      - name: Verify production entrypoint is seed-free
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R 'SpikeSeedData' \
            spike/ibex_foundation/lib/main_production.dart \
            spike/ibex_foundation/lib/ui/ibex_production_root.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies and generate Drift code
        working-directory: spike/ibex_foundation
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze production source
        working-directory: spike/ibex_foundation
        run: flutter analyze

      - name: Run tests
        working-directory: spike/ibex_foundation
        run: flutter test

      - name: Generate temporary Android host until committed host milestone
        working-directory: spike/ibex_foundation
        run: |
          rm -rf /tmp/ibex_android_host android
          flutter create --platforms=android --org com.ibex.had --project-name ibex_foundation_spike /tmp/ibex_android_host
          cp -R /tmp/ibex_android_host/android ./android

      - name: Build ARM64 production entrypoint candidate
        working-directory: spike/ibex_foundation
        run: flutter build apk --release --target lib/main_production.dart --target-platform android-arm64 --split-per-abi

      - name: Show candidate size
        working-directory: spike/ibex_foundation
        run: ls -lh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Publish non-production-signed candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ibex-production-entrypoint-arm64-NOT-PRODUCTION-SIGNED
          path: spike/ibex_foundation/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
