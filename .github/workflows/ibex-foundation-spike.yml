name: IBEX Foundation Spike

on:
  push:
    branches:
      - spike/android-foundation-v1
    paths:
      - 'spike/ibex_foundation/**'
      - '.github/workflows/ibex-foundation-spike.yml'
  workflow_dispatch:

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike/ibex_foundation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
