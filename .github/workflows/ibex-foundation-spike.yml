name: IBEX Foundation Spike

on:
  push:
    branches:
      - spike/android-foundation-v1
    paths:
      - 'spike/ibex_foundation/**'
      - '.github/workflows/ibex-foundation-spike.yml'
  workflow_dispatch:

concurrency:
  group: ibex-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike/ibex_foundation

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
