name: IBEX HAD MCP

on:
  push:
    branches:
      - feat/ibex-had-accounting-mcp-v1
    paths:
      - 'mcp-server/**'
      - 'mcp-worker/**'
      - '.github/workflows/ibex-had-mcp.yml'
  pull_request:
    paths:
      - 'mcp-server/**'
      - 'mcp-worker/**'
      - '.github/workflows/ibex-had-mcp.yml'

jobs:
  node-transport:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run smoke

  cloudflare-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-worker

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run dry-run
